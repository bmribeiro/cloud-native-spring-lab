services:
  users-db:
    image: postgres:17-alpine
    container_name: cloudgraphql-users-db
    environment:
      POSTGRES_DB: ${USERS_DB:-usersdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cloudgraphql

  orders-db:
    image: postgres:17-alpine
    container_name: cloudgraphql-orders-db
    environment:
      POSTGRES_DB: ${ORDERS_DB:-ordersdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cloudgraphql

  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: cloudgraphql-users-service
    environment:
      SERVER_PORT: 3001
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/${USERS_DB:-usersdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
    expose:
      - "3001"
    depends_on:
      users-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - cloudgraphql
    restart: unless-stopped

  orders-service:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: cloudgraphql-orders-service
    environment:
      SERVER_PORT: 3002
      SPRING_DATASOURCE_URL: jdbc:postgresql://orders-db:5432/${ORDERS_DB:-ordersdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-app}
    expose:
      - "3002"
    depends_on:
      orders-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - cloudgraphql
    restart: unless-stopped

  graphql-gateway:
    build:
      context: ./graphql-gateway
      dockerfile: Dockerfile
    container_name: cloudgraphql-graphql-gateway
    environment:
      SERVER_PORT: 4000
      USERS_SERVICE_URL: http://users-service:3001
      ORDERS_SERVICE_URL: http://orders-service:3002
      GRAPHIQL_ENABLED: ${GRAPHIQL_ENABLED:-true}
    ports:
      - "${GRAPHQL_GATEWAY_PORT:-4000}:4000"
    depends_on:
      users-service:
        condition: service_healthy
      orders-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - cloudgraphql
    restart: unless-stopped

networks:
  cloudgraphql:
    driver: bridge

volumes:
  users-db-data:
  orders-db-data:
