server.port=8081
spring.application.name=product-service

# Expose only the Actuator endpoints needed by this demo.
# /actuator/health is used for service health checks.
# /actuator/info can expose basic application metadata if configured.
management.endpoints.web.exposure.include=health,info

# Do not expose detailed health information.
# The endpoint returns only the global status, for example: {"status":"UP"}.
management.endpoint.health.show-details=never

# Enable liveness and readiness health endpoints:
# /actuator/health/liveness
# /actuator/health/readiness
# These are useful for Docker/Kubernetes health checks.
management.endpoint.health.probes.enabled=true