name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-services:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - product-service
          - order-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build service
        working-directory: ${{ matrix.service }}
        run: mvn -B clean package
